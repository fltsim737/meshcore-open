# iPhone builds on GitHub's Macs (no Mac needed locally).
# Every push to the SOS or SOS Voice branch, or a manual run, builds the app.
# Without the Apple secrets it builds unsigned, to prove it compiles.
# With them it signs with the Apple account (cloud-managed signing) and
# uploads the build to TestFlight / App Store Connect.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   APPLE_TEAM_ID         10-character Team ID (developer.apple.com > Membership)
#   ASC_KEY_ID            App Store Connect API key ID (Users and Access > Integrations, Admin role)
#   ASC_ISSUER_ID         Issuer ID shown above the keys
#   ASC_KEY_P8_BASE64     the downloaded AuthKey_XXXX.p8 file, base64-encoded
name: iOS

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to TestFlight (needs the Apple secrets)"
        type: boolean
        default: true
  push:
    branches:
      - feat/emergency-sos
      - feat/sos-voice
    paths-ignore:
      - "**.md"
      - "documentation/**"

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      HAS_APPLE: ${{ secrets.ASC_KEY_P8_BASE64 != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Build number
        run: echo "BUILD_NUMBER=$((1000 + ${{ github.run_number }}))" >> "$GITHUB_ENV"

      - run: flutter pub get

      - name: Build (unsigned)
        if: env.HAS_APPLE != 'true'
        run: |
          flutter build ios --release --no-codesign --build-number "$BUILD_NUMBER"
          echo "Bundled frameworks:"; ls build/ios/iphoneos/Runner.app/Frameworks
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' build/ios/iphoneos/Runner.app/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' build/ios/iphoneos/Runner.app/Info.plist
          cd build/ios/iphoneos && zip -qry "$GITHUB_WORKSPACE/Runner-unsigned.zip" Runner.app

      - uses: actions/upload-artifact@v4
        if: env.HAS_APPLE != 'true'
        with:
          name: ios-unsigned-${{ github.run_number }}
          path: Runner-unsigned.zip
          retention-days: 7

      - name: Apple API key
        if: env.HAS_APPLE == 'true'
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/asc/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Archive (signed)
        if: env.HAS_APPLE == 'true'
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          flutter build ios --release --config-only --build-number "$BUILD_NUMBER"
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic \
            archive | tail -40

      - name: Upload to TestFlight
        if: env.HAS_APPLE == 'true' && (github.event_name == 'push' || inputs.upload)
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          sed "s/__TEAM__/$TEAM/" ios/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Uploaded build $BUILD_NUMBER to App Store Connect."
